name: Build & Deploy Burger Singh App

on:
  push:
    branches:
      - claude/beautiful-volta-VHrrY
      - main
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: 'burger-singh-app/package-lock.json'

      - name: Install dependencies
        working-directory: burger-singh-app
        run: npm ci

      - name: Build application
        working-directory: burger-singh-app
        env:
          CI: false
        run: npm run build

      - name: Deploy to gh-pages branch
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./burger-singh-app/build
          cname: ''
